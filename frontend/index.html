<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AILA Console</title>

    <!--
      #47 -- Content-Security-Policy (defence-in-depth XSS mitigation).

      * script-src 'self' -- no inline scripts, no eval. The theme init
        moved out of an inline <script> block into /theme-init.js so
        this policy holds without a fragile sha256- allowance.
      * style-src 'self' 'unsafe-inline' https://fonts.googleapis.com --
        Vite + Tailwind emit inline style attributes for dynamic values
        (widget grid sizing, chart colours) which cannot be hashed at
        build time; the risk profile of inline styles is far lower than
        inline scripts.
      * img-src 'self' data: blob: -- data: for chart legends and small
        SVG glyphs Vite inlines during build, blob: for on-page canvas
        exports (html2canvas).
      * font-src 'self' https://fonts.gstatic.com -- Google Fonts CDN.
      * connect-src 'self' http: https: ws: wss: -- API host is
        deployment-specific (proxied through same origin OR configured
        via AILA_API_URL) so this stays permissive; the real barrier
        is the JWT auth layer.
      * frame-src 'none' -- refuse to embed frames (honored in a <meta>).
        Clickjacking protection (refusing to BE framed) uses
        frame-ancestors, which browsers only honor as an HTTP header, not
        in a <meta>; it is delivered by the backend SecurityHeadersMiddleware
        (Content-Security-Policy: frame-ancestors 'none' + X-Frame-Options:
        DENY), so it is intentionally not repeated here (#225).
      * object-src 'none' + base-uri 'self' + form-action 'self' --
        block plugin content, <base> hijacking, and off-origin form
        posts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http: https: ws: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!--
      #47 -- flash-free theme init as an external script so no inline
      script is required for the CSP above. Blocking + head-placed so
      it runs synchronously before <body> renders.
    -->
    <script src="/theme-init.js"></script>

    <!--
      Font preload -- display + body.
    -->
    <link
      rel="preload"
      href="/fonts/Syne-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Google Fonts -- theme-specific display faces. Each theme's signature
      identity partially depends on its typography, so these load up-front
      but with swap behaviour. font-display:swap is enforced via &display=swap.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&family=Cascadia+Code:wght@400;700&family=DM+Serif+Display&family=Quicksand:wght@400;500;700&family=VT323&family=Michroma&family=Rajdhani:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Lora:wght@400;700&family=Black+Ops+One&family=Roboto+Mono:wght@400;500;700&family=Pacifico&family=UnifrakturMaguntia&family=Crimson+Text:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;700&family=Share+Tech+Mono&family=Courier+Prime:wght@400;700&family=Orbitron:wght@400;500;700&family=Press+Start+2P&family=Special+Elite&family=Marcellus+SC&family=Major+Mono+Display&family=IM+Fell+English+SC&family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&family=Bungee&family=Bungee+Shade&family=Rubik+Glitch&family=Rubik+Mono+One&family=Monoton&family=Audiowide&family=Silkscreen&family=Pixelify+Sans:wght@400;700&family=B612+Mono&family=Iceberg&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
