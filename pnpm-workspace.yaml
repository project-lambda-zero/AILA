packages:
  - frontend
  - packages/*
  - tools/oxlint

# pnpm 10+ reads overrides from this file's top-level `overrides:` key;
# the equivalent `pnpm.overrides` block in package.json is silently ignored.
overrides:
  postcss: ">=8.5.23"
  nanoid: ">=3.3.18"
  dompurify: ">=3.4.17"
  source-map-js: ">=1.2.2"

catalog:
  typescript: 6.0.2

catalogs:
  react19:
    react: 19.2.7
    react-dom: 19.2.7
    "@types/react": 19.2.17
    "@types/react-dom": 19.2.3

  vite:
    vite: 8.3.5
    "@vitejs/plugin-react": 6.1.2

  query:
    "@tanstack/react-query": 5.101.0

  ui:
    "@monaco-editor/react": 4.7.0
    monaco-editor: 0.55.1
    zustand: 5.0.14

  lint:
    oxlint: 1.76.0
    "@oxlint/plugins": 1.76.0

  types:
    "@types/node": 24.7.2
