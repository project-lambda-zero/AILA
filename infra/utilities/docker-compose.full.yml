# AILA full stack -- postgres + redis + API + workers + frontend.
#
# The base file publishes no host ports: put the API and frontend behind
# a reverse proxy/load balancer. Development adds localhost publications
# through docker-compose.full.dev.yml.
#
# Usage (from infra/utilities, after creating the repo-root .env):
#   # Production-shaped base; no fixed host ports
#   docker compose --env-file ../../.env -f docker-compose.full.yml up --build
#   # Development; publishes API/frontend/postgres/redis on localhost ports
#   docker compose --env-file ../../.env \
#     -f docker-compose.full.yml -f docker-compose.full.dev.yml up --build
#
# After development bring-up:
#   API:       http://localhost:8000
#   Frontend:  http://localhost:3000
#   Postgres:  localhost:5432   (postgres / changeme)
#   Redis:     localhost:6379
#
# --env-file supplies Compose interpolation as well as container settings.
# The endpoint defaults below preserve in-cluster discovery when unset.

name: aila-full

x-aila-env: &aila-env
  AILA_DATABASE_URL: ${AILA_DATABASE_URL:-postgresql+asyncpg://postgres:changeme@postgres:5432/aila}
  AILA_PLATFORM_REDIS_URL: ${AILA_PLATFORM_REDIS_URL:-redis://redis:6379/0}
  AILA_API_HOST: 0.0.0.0
  AILA_API_PORT: "8000"
  AILA_PLATFORM_FRONTEND_URL: http://localhost:3000

x-aila-backend-volumes: &aila-backend-volumes
  - aila_data:/app/data
  - aila_reports:/app/reports
  - aila_backups:/app/backups

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Same connection ceiling as docker-compose.yml (see the note there).
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: aila
    expose:
      - "5432"
    volumes:
      - aila_postgres_data:/var/lib/postgresql/data
      - ../postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aila"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - aila_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes: *aila-backend-volumes
    # The image's default CMD already runs `aila serve` on 0.0.0.0:8000.

  # One worker container per queue. Workers share the API image -- the
  # entrypoint is the same `aila` CLI, only the CMD differs. Per
  # D-13 each queue has its own worker process so a slow vr task
  # can't block forensics dispatch.
  worker-default:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *aila-backend-volumes
    command: ["worker", "-q", "default"]

  worker-vr:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *aila-backend-volumes
    command: ["worker", "-q", "vr"]

  worker-vulnerability:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *aila-backend-volumes
    command: ["worker", "-q", "vulnerability"]

  worker-forensics:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *aila-backend-volumes
    command: ["worker", "-q", "forensics"]

  worker-malware:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *aila-backend-volumes
    command: ["worker", "-q", "malware"]

  worker-pentest:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *aila-backend-volumes
    command: ["worker", "-q", "pentest"]

  worker-pentest-runtime:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *aila-backend-volumes
    command: ["worker", "-q", "pentest_runtime"]

  worker-dynamic-pentest:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *aila-backend-volumes
    command: ["worker", "-q", "dynamic_pentest"]

  worker-dynamic-pentest-runtime:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *aila-backend-volumes
    command: ["worker", "-q", "dynamic_pentest_runtime"]

  worker-forensics-readiness:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *aila-backend-volumes
    command: ["worker", "-q", "forensics_readiness"]

  worker-reporting:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      <<: *aila-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *aila-backend-volumes
    command: ["worker", "-q", "reporting"]

  frontend:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../..:/app
      - aila_frontend_node_modules:/app/node_modules
      - aila_frontend_pnpm_store:/root/.local/share/pnpm
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    expose:
      - "3000"
    # Vite dev server. For production, build a static bundle and
    # serve via nginx/caddy instead -- this compose targets
    # developer-machine iteration.
    command:
      - sh
      - -c
      - |
        corepack enable && \
        corepack prepare pnpm@10.30.3 --activate && \
        pnpm install --frozen-lockfile && \
        pnpm --filter @aila/shell run dev -- --host 0.0.0.0
    depends_on:
      - api

volumes:
  aila_data:
    name: aila_data
  aila_reports:
    name: aila_reports
  aila_backups:
    name: aila_backups
  aila_postgres_data:
    name: aila_postgres_data
  aila_redis_data:
    name: aila_redis_data
  aila_frontend_node_modules:
    name: aila_frontend_node_modules
  aila_frontend_pnpm_store:
    name: aila_frontend_pnpm_store
